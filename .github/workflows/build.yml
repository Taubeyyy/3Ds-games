name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Spiele bauen (.3dsx + .cia)
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: spiele
          path: dist/*
      - name: Release veröffentlichen (QR-Links zeigen immer hierauf)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sammlung
          name: 3DS Sammlung (aktuell)
          body: Automatisch gebaut aus ${{ github.sha }}. Installation mit FBI per QR-Code, siehe Website.
          make_latest: true
          files: dist/*
